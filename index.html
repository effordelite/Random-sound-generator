<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Sound Generator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
      background: #f9f9f9;
      margin: 0;
    }

    img.logo {
      width: 120px;
      max-width: 40vw;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 6vw;
      max-font-size: 28px;
      margin-bottom: 25px;
    }

    button {
      font-size: 5vw;
      min-width: 50%;
      max-width: 250px;
      padding: 14px 24px;
      margin: 12px auto;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s, color 0.3s;
      display: block;
    }

    #startBtn.active {
      background-color: #4CAF50;
      color: white;
    }

    #stopBtn.active {
      background-color: #f44336;
      color: white;
    }

    #startBtn, #stopBtn {
      background-color: #e0e0e0;
      color: #333;
    }

    @media (min-width: 600px) {
      h1 {
        font-size: 24px;
      }

      button {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="Logo" class="logo" />

  <h1>Random Sound Generator</h1>
  <button id="startBtn" onclick="startSound()">Start</button>
  <button id="stopBtn" onclick="stopSound()">Stop</button>

  <script>
    const sound = new Audio('sound.mp3'); // Replace with your actual sound file
    let isRunning = false;
    let timeoutId;

    function playSoundRandomly() {
      if (!isRunning) return;

      sound.play();

      const delay = Math.floor(Math.random() * (12000 - 7000 + 1)) + 7000;
      timeoutId = setTimeout(playSoundRandomly, delay);
    }

    function startSound() {
      if (!isRunning) {
        isRunning = true;
        playSoundRandomly();

        document.getElementById("startBtn").classList.add("active");
        document.getElementById("stopBtn").classList.remove("active");

        document.getElementById("startBtn").textContent = "Running...";
        document.getElementById("stopBtn").textContent = "Stop";
      }
    }

    function stopSound() {
      isRunning = false;
      clearTimeout(timeoutId);

      document.getElementById("startBtn").classList.remove("active");
      document.getElementById("stopBtn").classList.add("active");

      document.getElementById("startBtn").textContent = "Start";
      document.getElementById("stopBtn").textContent = "Stopped";
    }
  </script>

</body>
</html>
